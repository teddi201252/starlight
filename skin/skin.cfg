# Starlight skin: what tools/slskin bakes into skin.slsk at build time.
# Every value comes from design/starlight-soft-ui (the CSS of the boards).
#
#   ground RRGGBB
#       The pearl ground. Opaque sprites are composed on it.
#   style NAME fill=RRGGBB | grad=RRGGBB,RRGGBB,DEG,STOP%
#              shadow=DX,DY,BLUR,RRGGBB[,ALPHA%]       (outer, first is on top)
#              inset=DX,DY,BLUR,RRGGBB[,ALPHA%[,SPREAD]]
#       A CSS surface: background plus box-shadow. BLUR is the CSS blur
#       radius (a Gaussian with sigma = BLUR/2).
#   surface NAME STYLE RADIUS [HEIGHT] [alpha]
#       A nine-slice sprite of STYLE with corner RADIUS. With HEIGHT it only
#       stretches sideways (pills, fields). "alpha" also bakes a premultiplied
#       copy (NAME-a) for surfaces that sit over something other than the
#       ground, such as windows over windows.
#   icon NAME FILE.svg
#       A source icon (viewBox 64 for apps, 24 for files).
#   tile SET STYLE SIZE RADIUS ICON_SIZE
#       Every app icon composed on a tile of STYLE, shadows included:
#       sprite "SET-ICONNAME".
#   fileicon NAME FILE.svg
#   filetile SET STYLE SIZE RADIUS ICON_SIZE
#       The same for the file icons: sprite "SET-NAME".
#   mask NAME FILE.svg PX
#       An SVG as an 8-bit coverage mask of PX x PX, tinted when drawn
#       (button glyphs, dots).
#   font NAME FILE.ttf PX [digits]
#       An 8-bit coverage atlas at PX pixels. "digits" keeps only 0-9, ':'
#       and space (the big clock).

ground E3E6EC

# --- surfaces ---------------------------------------------------------------
style flat      fill=E3E6EC shadow=3,3,8,C6CAD3 shadow=-3,-3,8,F6F7F9
style raised    fill=E3E6EC shadow=9,9,20,B9BEC9 shadow=-9,-9,20,FFFFFF
style raised-sm fill=E3E6EC shadow=5,5,12,BCC1CB shadow=-5,-5,12,FFFFFF
style inset     fill=E3E6EC inset=5,5,10,C2C6D0 inset=-5,-5,10,FFFFFF
style night     fill=111626 shadow=9,9,20,B9BEC9 shadow=-6,-6,16,FFFFFF
style night-sm  fill=111626 shadow=5,5,12,BCC1CB
style night-glow fill=111626 shadow=0,0,8,59D0FF
style neon      fill=59D0FF shadow=0,0,8,59D0FF
style neon-dot  fill=59D0FF shadow=0,0,10,59D0FF
style win-btn   fill=E3E6EC shadow=4,4,10,BCC1CB shadow=-4,-4,10,FFFFFF

# Icon tiles: rest, under the mouse, pressed.
style tile      grad=18264C,0D1631,150,70 shadow=5,5,12,B9BEC9 shadow=-5,-5,12,FFFFFF inset=1,1,0,FFFFFF,10
style tile-big  grad=18264C,0D1631,150,70 shadow=9,9,20,B9BEC9 shadow=-9,-9,20,FFFFFF inset=1,1,0,FFFFFF,10
style tile-hi   grad=1C2C58,0F1938,150,70 shadow=12,12,24,B3B8C4 shadow=-10,-10,22,FFFFFF inset=0,0,0,59D0FF,35,1
style tile-down grad=0D1631,0A1126,150,70 inset=4,4,10,050A18 inset=-3,-3,8,1F2E5A

# Windows and panels. Windows sit over anything (the wallpaper, other
# windows), so they are drawn from their premultiplied copy: the active one
# raised, the others flat. Their title bar buttons sit on the pearl of the
# window, but they are closer together than their shadows reach, so they
# blend too; their shadow is a little shorter than raised-sm, to stay inside
# the window's opaque inside.
surface window      raised    32 alpha
surface window-flat flat      32 alpha
surface win-btn     win-btn   14 28 alpha
surface win-btn-down inset    14 28 alpha
surface dot-neon    neon-dot  5  10
surface panel       raised    26
surface card        raised    22
surface dock        raised    46
surface card-sm     raised-sm 22
surface list        raised-sm 26
surface flat        flat      22
surface well        inset     22
surface night       night     34
surface night-card  night     22
# Controls with a fixed height.
surface button      raised-sm 24 48
surface button-down inset     24 48
surface button-main night-sm  24 48
surface field       inset     26 52
surface row-sel     inset     22 44
surface segment     raised-sm 26 52
surface segment-on  night-sm  20 40
surface toggle      inset     16 32
surface knob        raised-sm 12 24
surface knob-on     night-glow 12 24
surface check       inset     9  28
surface slider      inset     6  12
surface slider-fill night-sm  6  12
surface thumb       raised-sm 14 28
surface badge       neon      5  10

# --- icons ------------------------------------------------------------------
icon orbit         icons/orbit.svg
icon voyager       icons/voyager.svg
icon calcolatrice  icons/calcolatrice.svg
icon curiosity     icons/curiosity.svg
icon impostazioni  icons/impostazioni.svg
icon installer     icons/installer.svg
icon musica        icons/musica.svg
icon rete          icons/rete.svg
icon monitor       icons/monitor.svg
icon sistema       icons/sistema.svg

# Dock: 60 px tiles with 44 px icons; under the mouse they grow by a tenth,
# pressed they sink and the icon shrinks a little (tavola Icone, "Stati").
tile dock      tile      60 18 44
tile dock-hi   tile-hi   66 20 48
tile dock-down tile-down 60 18 41
# App manager: 96 px tiles.
tile manager    tile    96 26 66
tile manager-hi tile-hi 104 28 72

fileicon file-cartella icons/file-cartella.svg
fileicon file-testo    icons/file-testo.svg
fileicon file-immagine icons/file-immagine.svg
fileicon file-audio    icons/file-audio.svg
fileicon file-codice   icons/file-codice.svg
filetile files raised 72 22 30

# --- glyphs ------------------------------------------------------------------
mask win-close glyphs/win-close.svg 12
mask win-min   glyphs/win-min.svg   12
mask win-max   glyphs/win-max.svg   12
mask dot-12    glyphs/dot.svg       12

# --- fonts ------------------------------------------------------------------
# Outfit for the interface, in the sizes the boards use.
font ui-13       fonts/Outfit-Regular.ttf  13
font ui-13-bold  fonts/Outfit-SemiBold.ttf 13
font ui-14       fonts/Outfit-Regular.ttf  14
font ui-15       fonts/Outfit-Regular.ttf  15
font ui-15-mid   fonts/Outfit-Medium.ttf   15
font ui-16       fonts/Outfit-Regular.ttf  16
font ui-16-mid   fonts/Outfit-Medium.ttf   16
font ui-17       fonts/Outfit-Regular.ttf  17
font ui-19-mid   fonts/Outfit-Medium.ttf   19
font ui-20       fonts/Outfit-Regular.ttf  20
font ui-22-light fonts/Outfit-Light.ttf    22
font ui-22-mid   fonts/Outfit-Medium.ttf   22
font ui-24       fonts/Outfit-Regular.ttf  24
font ui-26-light fonts/Outfit-Light.ttf    26
font ui-30-light fonts/Outfit-Light.ttf    30
font ui-34-light fonts/Outfit-Light.ttf    34
font ui-42-light fonts/Outfit-Light.ttf    42
font ui-84-thin  fonts/Outfit-ExtraLight.ttf 84 digits
# JetBrains Mono for the terminal, the editor and the clock widget.
font mono-13     ../resources/fonts/JetBrainsMono-Regular.ttf 13
font mono-14     ../resources/fonts/JetBrainsMono-Regular.ttf 14
font mono-15     ../resources/fonts/JetBrainsMono-Regular.ttf 15
font mono-16     ../resources/fonts/JetBrainsMono-Regular.ttf 16
font mono-16-bold fonts/JetBrainsMono-SemiBold.ttf 16
font mono-24     ../resources/fonts/JetBrainsMono-Regular.ttf 24
font mono-30-light fonts/JetBrainsMono-Light.ttf 30
font mono-32     ../resources/fonts/JetBrainsMono-Regular.ttf 32
font clock-136   fonts/JetBrainsMono-Light.ttf 136 digits
