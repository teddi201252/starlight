# Starlight desktop config
# This file is staged into /starlight/config/settings.cfg during image build.
background=/starlight/backgrounds/starlight.png
cursor=/starlight/cursor.png
cursor_scale=100
font=/starlight/fonts/8Bit.font
animations_enabled=1
# 100 = normale, 10 = molto piu' lenta, 400 = piu' veloce
animation_speed_pct=50
# Soglia doppio click globale (ms), usata dal desktop per tutti i controlli UI.
double_click_ms=300
# Layout tastiera: us, it oppure path .keymap sotto /starlight/keymaps.
keyboard_layout=us
# Key repeat tastiera (delay iniziale in ms, frequenza in Hz).
keyboard_repeat_delay_ms=250
keyboard_repeat_rate_hz=30
